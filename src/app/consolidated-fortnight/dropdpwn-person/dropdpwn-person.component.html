<div class="container">
  <div class="dropdown">
    <input 
      type="text" 
      class="sdropdown" 
      [value]="selectedOption" 
      (input)="onOptionSelected($event)" 
      list="personOptions" 
      placeholder="PERSONAL" 
    />
    <datalist id="personOptions">
      <option *ngFor="let option of dropdownOptions" [value]="option"></option>
    </datalist>
  </div>
</div>
